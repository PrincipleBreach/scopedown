<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>ScopeDown</title>
  <link rel="preload" href="../fonts/switzer-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/switzer-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="app" data-state="loading" aria-busy="true">
    <header class="bar">
      <svg class="glyph" viewBox="0 0 16 16" aria-hidden="true">
        <rect width="16" height="16" rx="3" class="glyph-tile"/>
        <path d="M2.5 6.5v-4h4M9.5 2.5h4v4M13.5 9.5v4h-4M6.5 13.5h-4v-4" class="glyph-frame"/>
        <path d="M5 11.5v-2l6-3.5v5.5z" class="glyph-wedge"/>
      </svg>
      <span class="product">ScopeDown</span>
      <a class="maker" href="https://principlebreach.com/?utm_source=scopedown&amp;utm_medium=referral&amp;utm_campaign=popup-header" target="_blank" rel="noopener" title="Principle Breach">
        <picture>
          <source srcset="../icons/pb-mark-light.png" media="(prefers-color-scheme: dark)">
          <img src="../icons/pb-mark.png" alt="Principle Breach" width="16" height="14">
        </picture>
      </a>
    </header>

    <section class="head rise">
      <p class="eyebrow" id="sub"><span class="redact" style="--w: 46%"></span></p>
      <h1 id="name"><span class="redact" style="--w: 70%"></span></h1>
      <p class="note" id="note" hidden></p>
    </section>

    <dl class="cells rise" id="stats">
      <div><dt class="label">In scope</dt><dd id="in"><span class="redact" style="--w: 1.4em"></span></dd></div>
      <div><dt class="label">Out</dt><dd id="out"><span class="redact" style="--w: 1.2em"></span></dd></div>
      <div><dt class="label">Top reward</dt><dd id="top"><span class="redact" style="--w: 3.2em"></span></dd></div>
    </dl>

    <ul class="rows rules rise" id="rules" hidden></ul>

    <div class="actions rise" id="actions">
      <button class="action" id="copy" title="Copy Markdown (Enter)" disabled>
        <span class="label-text">Copy Markdown</span><span class="key" aria-hidden="true">↵</span>
      </button>
      <div class="more">
        <button class="link link--muted" id="targets" title="Copy targets (T)" disabled><span class="label-text">Copy targets</span><kbd>T</kbd></button>
        <button class="link link--muted" id="download" title="Save as .md (D)" disabled><span class="label-text">Save .md</span><kbd>D</kbd></button>
        <button class="link link--muted" id="toggle-preview" title="Preview (P)" aria-controls="preview" aria-expanded="false" disabled><span class="label-text">Preview</span><kbd>P</kbd></button>
      </div>
    </div>

    <button class="action action--outline" id="retry" hidden><span>Try again</span><kbd>R</kbd></button>

    <section class="preview" id="preview-wrap" hidden>
      <div class="preview-head"><span class="label">Markdown</span><span class="label" id="size"></span></div>
      <pre id="preview" tabindex="0" aria-label="Markdown preview"></pre>
    </section>

    <footer class="agent" id="agent">
      <div class="agent-row">
        <a class="agent-open" id="agent-open" href="console.html" target="_blank" title="Open the agent console">
          <span class="agent-name">Agents</span>
          <span class="agent-state" id="agent-state"></span>
        </a>
        <input type="checkbox" class="switch" id="agent-switch" aria-label="Let AI agents use this browser's HackerOne and Bugcrowd access">
      </div>
      <button class="cmd agent-setup" id="agent-setup" title="Copy the install command" hidden><code id="agent-setup-cmd">npx @principlebreach/scopedown-mcp install</code><span class="cmd-copy">Copy</span></button>
    </footer>

    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
