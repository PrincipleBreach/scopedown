name: Feature request
description: A change to the extension, the agent tools or a new platform.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind. For a new platform, see CONTRIBUTING.md#add-a-platform first.
